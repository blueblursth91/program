<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="font.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Program</title>
  <style>
    body {
      background-color: #111; /* Fondo oscuro para ver el texto blanco */
      margin: 0;
    }
    
    /* Efecto visual opcional para la barra parpadeante de la máquina */
    .cursor {
      font-weight: 100;
      animation: blink 0.7s infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- El contenedor h1 inicia completamente vacío -->
  <h1 id="typewriter" style="font-family: 'Roco', sans-serif; color: white; text-align: center; margin-top: 45vh;"><span id="text"></span><span class="cursor">|</span></h1>

  <script>
    const textContainer = document.getElementById('text');
    const fullText = "H e l l o"; // El texto exacto con tus espacios
    let index = 0;

    function type() {
      if (index < fullText.length) {
        // Añade la letra actual al contenedor
        textContainer.textContent += fullText.charAt(index);
        index++;
        
        // Controla la velocidad de escritura (150 milisegundos por letra)
        setTimeout(type, 150); 
      }
    }

    // Arranca la animación automáticamente al cargar la página
    window.onload = type;
  </script>

</body>
</html>
