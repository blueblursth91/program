<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="font.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Program</title>
  <style>
    body {
      background-color: #111;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #my-title {
      font-family: 'Roco', sans-serif;
      color: white;
      text-align: center;
      margin: 0;
      min-width: 400px; 
    }
  </style>
</head>
<body>

  <h1 id="my-title"></h1>

  <script>
    // 1. Una función ultra simple para pausar el tiempo (en segundos)
    const wait = (seconds) => new Promise(resolve => setTimeout(resolve, seconds * 1000));

    // 2. La función typewriter limpia (solo escribe el texto y avisa cuando termina)
    function typewriter(elementId, textToType, speed) {
      return new Promise((resolve) => {
        const container = document.getElementById(elementId);
        if (!container) return resolve();

        container.textContent = ""; 
        let index = 0;

        function nextChar() {
          if (index < textToType.length) {
            container.textContent += textToType.charAt(index);
            index++;
            setTimeout(nextChar, speed);
          } else {
            resolve(); // <- Avisa que terminó de escribir la última letra
          }
        }
        nextChar();
      });
    }

    // 3. AQUÍ CONTROLAS TODO EL FLUJO COMO QUIERAS (Sin quemar lógica dentro de las funciones)
    async function startProgram() {
      
      // Escribe el primer texto y espera a que termine
      await typewriter('my-title', 'H e l l o ?', 150);
      
      // ESPERA 2 SEGUNDOS
      await wait(2);
      
      // Ejecuta la función de nuevo con cambios
      await typewriter('my-title', 'A r e    w e . . .', 150);
      
      // ESPERA 3 SEGUNDOS
      await wait(3);
      
      // Ejecuta la función otra vez con cambios
      await typewriter('my-title', 'C o n n e c t e d ?', 150);
    }

    // Arranca tu flujo al cargar la página
    window.onload = startProgram;
  </script>

</body>
</html>
