<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="font.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Program</title>
  <style>
    body {
      background-color: #111;
      margin: 0;
      /* Flexbox asegura un centrado absoluto en toda la pantalla */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #typewriter {
      font-family: 'Roco', sans-serif;
      color: white;
      text-align: center;
      margin: 0;
      /* Añadir un ancho mínimo evita saltos visuales raros al escribir */
      min-width: 300px; 
    }
  </style>
</head>
<body>

  <!-- El elemento h1 ahora está limpio, sin cursores ni estilos en línea complejos -->
  <h1 id="typewriter"></h1>

  <script>
    const textContainer = document.getElementById('typewriter');
    const fullText = "H e l l o";
    let index = 0;

    function type() {
      if (index < fullText.length) {
        // Inserta el texto directamente sin agregar elementos extra
        textContainer.textContent += fullText.charAt(index);
        index++;
        
        // Tiempo en milisegundos entre letras
        setTimeout(type, 180); 
      }
    }

    // Iniciar la animación al cargar la página
    window.onload = type;
  </script>

</body>
</html>
